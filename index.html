<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Note Jagoo</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 30% 20%, #fef9e7, #fde68a, #fca5a5, #f87171);
            background-attachment: fixed;
        }
        .glass-card {
            max-width: 780px;
            width: 100%;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 40px;
            padding: 32px 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.08);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header-top { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 2px; }
        .logo-icon {
            width: 52px; height: 52px;
            background: linear-gradient(145deg, #f59e0b, #ef4444);
            border-radius: 18px;
            display: flex;
            align-items: center; justify-content: center;
            font-size: 1.8rem; color: #fff;
            box-shadow: 0 8px 24px rgba(245,158,11,0.3);
        }
        .header h1 {
            font-size: 2.2rem; font-weight: 800;
            background: linear-gradient(to right, #b45309, #dc2626);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .event-info {
            font-size: 0.85rem; font-weight: 400; color: rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.2);
            padding: 4px 18px; border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.15);
            display: inline-flex; align-items: center; gap: 10px;
            margin-bottom: 6px;
        }
        .event-info i { color: #f59e0b; font-size: 0.75rem; }
        .header-sub {
            font-size: 1rem; font-weight: 600; color: #991b1b;
            letter-spacing: 0.3px; margin-bottom: 8px; opacity: 0.85;
        }
        .header-sub i { color: #f59e0b; margin-right: 6px; }
        .badge-free {
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.12);
            color: #991b1b; padding: 4px 16px; border-radius: 100px;
            font-size: 0.75rem; font-weight: 700;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .badge-free i { color: #059669; }

        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
            margin-bottom: 6px;
        }
        @media (max-width:600px) { .form-grid { grid-template-columns: 1fr; gap: 10px; } }

        .input-group { position: relative; }
        .input-group i {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: rgba(0,0,0,0.2); font-size: 0.9rem;
        }
        .input-group input, .input-group textarea {
            width: 100%; padding: 12px 14px 12px 42px;
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 16px;
            color: #1f1f1f; font-size: 0.9rem; font-weight: 500;
            font-family: 'Inter', sans-serif;
            transition: 0.25s ease;
        }
        .input-group input:focus, .input-group textarea:focus {
            outline: none; border-color: #f59e0b;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 0 0 4px rgba(245,158,11,0.08);
        }
        .input-group input::placeholder, .input-group textarea::placeholder {
            color: rgba(0,0,0,0.2); font-weight: 400;
        }
        .textarea-wrap { margin-top: 12px; }
        .textarea-wrap i { top: 20px; }
        .textarea-wrap textarea { padding: 14px 14px 14px 42px; min-height: 90px; resize: vertical; }

        .char-counter {
            text-align: right; font-size: 0.7rem; font-weight: 600;
            color: rgba(0,0,0,0.2); margin-top: 6px;
        }
        .char-counter.limit { color: #dc2626; }

        .btn-submit {
            width: 100%; margin-top: 16px; padding: 14px;
            background: linear-gradient(145deg, #f59e0b, #ef4444);
            border: none; border-radius: 20px;
            color: #fff; font-weight: 700; font-size: 1rem;
            font-family: 'Inter', sans-serif; cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 6px 24px rgba(239,68,68,0.2);
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(239,68,68,0.3);
            background: linear-gradient(145deg, #fbbf24, #f87171);
        }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .divider { margin: 28px 0 20px; border: none; height: 2px; background: linear-gradient(to right, transparent, rgba(0,0,0,0.08), transparent); }

        .comment-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px;
        }
        .comment-header h3 {
            color: rgba(0,0,0,0.5); font-weight: 700; font-size: 1rem;
            display: flex; align-items: center; gap: 10px;
        }
        .comment-header h3 i { color: rgba(0,0,0,0.15); }
        .comment-header .count-badge {
            background: rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.06);
            padding: 2px 12px; border-radius: 100px;
            font-size: 0.7rem; font-weight: 700; color: rgba(0,0,0,0.2);
        }

        .comment-list { max-height: 400px; overflow-y: auto; padding-right: 4px; }
        .comment-list::-webkit-scrollbar { width: 4px; }
        .comment-list::-webkit-scrollbar-track { background: transparent; }
        .comment-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 20px; }

        .comment-item {
            background: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 20px; padding: 16px 18px; margin-bottom: 12px;
        }
        .comment-item:hover { background: rgba(255,255,255,0.55); }

        .comment-meta {
            display: flex; flex-wrap: wrap; justify-content: space-between;
            align-items: center; gap: 6px; margin-bottom: 6px;
        }
        .comment-user {
            display: flex; align-items: center; gap: 12px;
            color: #1f1f1f; font-weight: 700; font-size: 0.9rem;
        }
        .comment-user .avatar {
            width: 32px; height: 32px; border-radius: 12px;
            background: linear-gradient(145deg, #f59e0b, #ef4444);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; font-weight: 700; color: #fff;
        }
        .comment-user .badge-dept {
            font-weight: 500; color: rgba(0,0,0,0.35); font-size: 0.75rem;
        }
        .comment-user .badge-company {
            font-weight: 500; color: rgba(0,0,0,0.3); font-size: 0.7rem;
            background: rgba(0,0,0,0.04); padding: 0 10px; border-radius: 100px;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .comment-time {
            font-size: 0.65rem; font-weight: 500; color: rgba(0,0,0,0.15);
        }
        .comment-text {
            color: rgba(0,0,0,0.75); font-size: 0.9rem; font-weight: 500;
            line-height: 1.6; white-space: pre-wrap; word-wrap: break-word;
            margin-top: 2px;
        }

        .state-center { text-align: center; padding: 30px 10px; color: rgba(0,0,0,0.15); font-weight: 500; }
        .state-center i { font-size: 1.8rem; display: block; margin-bottom: 10px; opacity: 0.4; }
        .state-center p { font-size: 0.9rem; }

        .comment-error {
            background: rgba(239,68,68,0.06);
            border: 1px solid rgba(239,68,68,0.1);
            color: #991b1b; padding: 12px 16px; border-radius: 16px;
            text-align: center; font-size: 0.85rem; font-weight: 600;
        }
        .comment-success {
            background: rgba(52,211,153,0.06);
            border: 1px solid rgba(52,211,153,0.1);
            color: #065f46; padding: 12px 16px; border-radius: 16px;
            text-align: center; font-size: 0.85rem; font-weight: 600;
            margin-top: 10px;
        }

        .toast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 14px 24px; border-radius: 20px;
            background: rgba(255,255,255,0.9); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.4);
            color: #1f1f1f; font-weight: 600; font-size: 0.9rem;
            box-shadow: 0 20px 48px rgba(0,0,0,0.06);
            transform: translateY(100px); opacity: 0;
            transition: 0.4s cubic-bezier(0.22,1,0.36,1);
            z-index: 999; display: flex; align-items: center; gap: 12px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success i { color: #059669; }
        .toast.error i { color: #dc2626; }
        .toast.info i { color: #f59e0b; }

        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width:600px) {
            .glass-card { padding: 24px 18px; border-radius: 28px; }
            .header h1 { font-size: 1.6rem; }
            .logo-icon { width: 42px; height: 42px; font-size: 1.4rem; border-radius: 14px; }
            .event-info { font-size: 0.7rem; padding: 3px 12px; gap: 6px; }
            .badge-free { font-size: 0.65rem; padding: 3px 12px; }
            .header-top { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="glass-card">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="header-top">
                <div class="logo-icon"><i class="fa-regular fa-note-sticky"></i></div>
                <h1>Sticky Note Jagoo</h1>
            </div>
            <div class="event-info">
                <i class="fa-regular fa-calendar"></i> Jakarta • July 27–31, 2026
            </div>
            <div class="header-sub">
                <i class="fa-regular fa-pen-to-square"></i> share your feedback
            </div>
            <div>
                <span class="badge-free">
                    <i class="fa-regular fa-circle-check"></i> No Login Required
                </span>
            </div>
        </div>

        <!-- ===== FORM ===== -->
        <div class="comment-form">
            <div class="form-grid">
                <div class="input-group">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="userName" placeholder="Your Name" maxlength="50" />
                </div>
                <div class="input-group">
                    <i class="fa-regular fa-building"></i>
                    <input type="text" id="userDepartment" placeholder="Department" maxlength="50" />
                </div>
                <div class="input-group">
                    <i class="fa-regular fa-id-badge"></i>
                    <input type="text" id="userCompany" placeholder="Company" maxlength="50" />
                </div>
            </div>

            <div class="input-group textarea-wrap">
                <i class="fa-regular fa-pen-to-square"></i>
                <textarea id="commentText" placeholder="Write your message…" maxlength="1000"></textarea>
            </div>

            <div class="char-counter" id="charCounter">0 / 1000</div>

            <button class="btn-submit" onclick="submitComment()" id="submitBtn">
                <i class="fa-regular fa-paper-plane"></i> Submit Note
            </button>
        </div>

        <div id="commentStatus"></div>

        <hr class="divider" />

        <!-- ===== COMMENT HEADER ===== -->
        <div class="comment-header">
            <h3><i class="fa-regular fa-comments"></i> Comments</h3>
            <span class="count-badge" id="commentCount">0</span>
        </div>

        <!-- ===== COMMENT LIST ===== -->
        <div class="comment-list" id="commentList">
            <div class="state-center">
                <i class="fa-regular fa-spinner spin"></i>
                <p>Loading comments…</p>
            </div>
        </div>

    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT — Google Sheets Comments                          -->
    <!-- ============================================================ -->
    <script>
        // ================================================================
        // 1. KONFIGURASI — URL GS BARU ANDA
        // ================================================================
        const CONFIG = {
            SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbybBU9Si2_Vr-OJmrSAkm6OWUg8GtRnj2s-SA8a-JTX/dev',
            MAX_COMMENTS: 100,
        };

        // ================================================================
        // 2. DOM REFS
        // ================================================================
        const $ = (id) => document.getElementById(id);
        const userName = $('userName');
        const userDept = $('userDepartment');
        const userCompany = $('userCompany');
        const commentText = $('commentText');
        const submitBtn = $('submitBtn');
        const commentList = $('commentList');
        const commentCount = $('commentCount');
        const commentStatus = $('commentStatus');
        const charCounter = $('charCounter');
        const toast = $('toast');

        // ================================================================
        // 3. INIT
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            loadComments();
            setupCharCounter();
            loadDrafts();
            setInterval(loadComments, 30000);
        });

        // ================================================================
        // 4. SUBMIT
        // ================================================================
        async function submitComment() {
            const name = userName.value.trim();
            const dept = userDept.value.trim();
            const company = userCompany.value.trim();
            const text = commentText.value.trim();

            if (!name) return showToast('Please enter your name.', 'error');
            if (!text) return showToast('Please write your message.', 'error');
            if (text.length > 1000) return showToast('Message too long! Max 1000 characters.', 'error');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-regular fa-spinner spin"></i> Submitting…';

            try {
                await fetch(CONFIG.SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        department: dept || 'Not specified',
                        company: company || 'Not specified',
                        text,
                        timestamp: new Date().toISOString(),
                    }),
                });

                commentText.value = '';
                userName.value = '';
                userDept.value = '';
                userCompany.value = '';
                updateCharCounter();
                clearDrafts();

                showToast('✅ Note submitted successfully!', 'success');
                setTimeout(loadComments, 1000);
            } catch {
                showToast('❌ Failed to submit. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> Submit Note';
            }
        }

        // ================================================================
        // 5. LOAD COMMENTS
        // ================================================================
        async function loadComments() {
            commentList.innerHTML = `
                <div class="state-center">
                    <i class="fa-regular fa-spinner spin"></i>
                    <p>Loading comments…</p>
                </div>
            `;

            try {
                const res = await fetch(CONFIG.SCRIPT_URL);
                const data = await res.json();

                if (data?.length) {
                    const sorted = data
                        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                        .slice(0, CONFIG.MAX_COMMENTS);

                    commentCount.textContent = sorted.length;

                    commentList.innerHTML = sorted
                        .map(
                            (c) => `
                            <div class="comment-item">
                                <div class="comment-meta">
                                    <div class="comment-user">
                                        <div class="avatar">${getInitials(c.name)}</div>
                                        ${escape(c.name)}
                                        ${c.department && c.department !== 'Not specified' ? `<span class="badge-dept"><i class="fa-regular fa-building"></i> ${escape(c.department)}</span>` : ''}
                                        ${c.company && c.company !== 'Not specified' ? `<span class="badge-company"><i class="fa-regular fa-id-badge"></i> ${escape(c.company)}</span>` : ''}
                                    </div>
                                    <div class="comment-time"><i class="fa-regular fa-clock"></i> ${formatDate(c.timestamp)}</div>
                                </div>
                                <div class="comment-text">${escape(c.text)}</div>
                            </div>
                        `
                        )
                        .join('');
                } else {
                    commentCount.textContent = '0';
                    commentList.innerHTML = `
                        <div class="state-center">
                            <i class="fa-regular fa-comment"></i>
                            <p>No notes yet. Be the first!</p>
                        </div>
                    `;
                }
            } catch {
                commentCount.textContent = '?';
                commentList.innerHTML = `
                    <div class="comment-error">
                        <i class="fa-regular fa-triangle-exclamation"></i>
                        Failed to load comments. Please refresh.
                    </div>
                `;
            }
        }

        // ================================================================
        // 6. HELPERS
        // ================================================================
        function getInitials(name) {
            return name
                .split(' ')
                .map((w) => w[0])
                .join('')
                .toUpperCase()
                .slice(0, 2);
        }

        function formatDate(ts) {
            try {
                return new Date(ts).toLocaleString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric',
                    hour: '2-digit', minute: '2-digit',
                });
            } catch {
                return 'Just now';
            }
        }

        function escape(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function setupCharCounter() {
            commentText.addEventListener('input', updateCharCounter);
        }

        function updateCharCounter() {
            const len = commentText.value.length;
            charCounter.textContent = `${len} / 1000`;
            charCounter.classList.toggle('limit', len > 900);
        }

        function loadDrafts() {
            const saved = (key) => localStorage.getItem(`sn_${key}`);
            if (saved('comment')) commentText.value = saved('comment');
            if (saved('name')) userName.value = saved('name');
            if (saved('dept')) userDept.value = saved('dept');
            if (saved('company')) userCompany.value = saved('company');
            updateCharCounter();
        }

        function clearDrafts() {
            ['comment', 'name', 'dept', 'company'].forEach((k) =>
                localStorage.removeItem(`sn_${k}`)
            );
        }

        commentText.addEventListener('input', () => {
            localStorage.setItem('sn_comment', commentText.value);
            updateCharCounter();
        });
        userName.addEventListener('input', () => localStorage.setItem('sn_name', userName.value));
        userDept.addEventListener('input', () => localStorage.setItem('sn_dept', userDept.value));
        userCompany.addEventListener('input', () => localStorage.setItem('sn_company', userCompany.value));

        // ================================================================
        // 7. TOAST
        // ================================================================
        let toastTimer;

        function showToast(msg, type = 'info') {
            const icons = { success: 'fa-regular fa-circle-check', error: 'fa-regular fa-circle-xmark', info: 'fa-regular fa-circle-info' };
            toast.innerHTML = `<i class="${icons[type] || icons.info}"></i> ${msg}`;
            toast.className = `toast ${type}`;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ================================================================
        // 8. EXPOSE
        // ================================================================
        window.submitComment = submitComment;

        console.log('🧠 Sticky Note Jagoo ready!');
        console.log(`📡 Script URL: ${CONFIG.SCRIPT_URL}`);
    </script>

</body>
</html>
